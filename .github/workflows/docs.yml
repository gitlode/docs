name: Documentation validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.11.0
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run source:acquire
      - run: npm run content:stage
      - run: npm run previews:build
